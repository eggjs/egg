name: Publish PR Preview

on:
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  contents: read

jobs:
  publish:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'pkg.pr.new') &&
      (github.event.action != 'labeled' || github.event.label.name == 'pkg.pr.new')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: pkg-pr-new-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    steps:
      - name: Checkout PR commit
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup utoo
        uses: utooland/setup-utoo@3a51006d0b66afcc32d1b9177a4b200b74f4a8cb # pinned from main

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          ut install --from pnpm
          git restore package.json

      - name: Build packages
        run: ut run build

      - name: Publish previews
        run: node scripts/publish-preview.js
