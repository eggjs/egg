name: Release

# Publish from the GitHub Releases page. Create/publish a release whose tag is
# v<semver>; the tag version becomes the egg/root package version and determines
# the semver bump applied to the other workspace packages. The workflow commits
# the version bump back to the release target branch and moves the release tag to
# that commit before publishing.

on:
  release:
    types: [published]

jobs:
  release:
    if: startsWith(github.event.release.tag_name, 'v')
    name: Publish Release
    runs-on: ubuntu-latest

    concurrency:
      group: release-${{ github.event.release.tag_name }}
      cancel-in-progress: false

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          ref: ${{ github.event.release.target_commitish }}
          fetch-depth: 0
          token: ${{ secrets.GIT_TOKEN }}

      - name: Setup utoo
        uses: utooland/setup-utoo@3a51006d0b66afcc32d1b9177a4b200b74f4a8cb # main

      - name: Setup pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: ut install --from pnpm

      - name: Resolve release version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import semver from 'semver';

          const tag = process.env.RELEASE_TAG;
          const version = tag.startsWith('v') ? tag.slice(1) : tag;
          if (!semver.valid(version)) {
            console.error(`Release tag ${tag} is not a valid v<semver> tag.`);
            process.exit(1);
          }

          const prerelease = semver.prerelease(version);
          const prereleaseId = prerelease?.find((part) => typeof part === 'string');
          const npmTag = prereleaseId || (process.env.RELEASE_PRERELEASE === 'true' ? 'beta' : 'latest');

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `npm_tag=${npmTag}\n`);
          console.log(`Version: ${version}`);
          console.log(`npm dist-tag: ${npmTag}`);
          EOF

      - name: Set package versions
        run: node scripts/set-release-version.js ${{ steps.release.outputs.version }}

      - name: Push version commit and tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_TARGET: ${{ github.event.release.target_commitish }}
        run: |
          if [[ -z "$RELEASE_TARGET" || "$RELEASE_TARGET" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release target must be a branch name so the version commit can be pushed. Got: $RELEASE_TARGET"
            exit 1
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet; then
            echo "No version changes to commit."
          else
            git add package.json packages plugins tools tegg
            git commit -m "chore(release): ${RELEASE_TAG} [skip ci]"
          fi

          git tag -f "$RELEASE_TAG"
          git push origin "HEAD:${RELEASE_TARGET}"
          git push origin "refs/tags/${RELEASE_TAG}" --force

      - name: Run build
        run: ut run build

      - name: Publish packages
        run: node scripts/publish.js --tag=${{ steps.release.outputs.npm_tag }} --provenance

      - name: Sync to cnpm
        if: ${{ !cancelled() }}
        run: node scripts/sync-cnpm.js

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Release tag: **${{ github.event.release.tag_name }}**" >> $GITHUB_STEP_SUMMARY
          echo "- Package version: **${{ steps.release.outputs.version }}**" >> $GITHUB_STEP_SUMMARY
          echo "- npm dist-tag: **${{ steps.release.outputs.npm_tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub Release: ${{ github.event.release.html_url }}" >> $GITHUB_STEP_SUMMARY
