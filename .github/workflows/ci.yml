name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  merge_group:

jobs:
  test:
    name: Test
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest, macos-latest, windows-latest'
      version: '20, 22, 24'
      install: 'corepack enable pnpm && pnpm install'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
