name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  merge_group:

jobs:
  lint:
    name: Lint
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest, macos-latest, windows-latest'
      version: '20, 22, 24'
      test: 'pnpm lint'
      install: 'corepack enable pnpm && pnpm install'

  build:
    name: Build
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest, macos-latest, windows-latest'
      version: '20, 22, 24'
      test: 'pnpm build'
      install: 'corepack enable pnpm && pnpm install'

  test:
    name: Test
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest, macos-latest, windows-latest'
      version: '20, 22, 24'
      test: 'pnpm test:cov'
      install: 'corepack enable pnpm && pnpm install'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
