name: CI

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  merge_group:

jobs:
  test:
    name: Test Packages
    uses: node-modules/github-actions/.github/workflows/node-test.yml@master
    with:
      os: 'ubuntu-latest, macos-latest, windows-latest'
      # node 20 not support import typescript directly
      #version: '20, 22, 24'
      version: '22, 24'
      install: 'corepack enable pnpm && pnpm install'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-egg-bin:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        node: ['22', '24']

    name: Test egg-bin with Node.js ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.workflow }}-#${{ github.event.pull_request.number || github.ref }}-(${{ matrix.os }}, ${{ matrix.node }})
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5 # Use the latest version of setup-node
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm' # Enable caching for pnpm dependencies

      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Install dependencies using pnpm

      - name: Run tests
        run: pnpm run --filter="@eggjs/bin" ci
