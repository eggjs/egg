name: CI

on:
  push:
    paths-ignore:
      - '**/*.md'
    branches: [next]
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '**/*.md'
    branches: [next]
  merge_group:

permissions:
  id-token: write
  actions: write

jobs:
  typecheck:
    runs-on: ubuntu-latest

    concurrency:
      group: typecheck-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm run lint

      - name: Check dedupe
        run: pnpm dedupe --check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run build
        run: pnpm run build

  test:
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        node: ['22', '24']
        filter: ['packages', 'tools', 'plugins']

    name: Test (${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.filter }})
    runs-on: ${{ matrix.os }}

    concurrency:
      group: test-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}-(${{ matrix.os }}, ${{ matrix.node }}, ${{ matrix.filter }})
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Start Redis (${{ matrix.os }})
        if: ${{ (matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest') && matrix.filter == 'plugins' }}
        uses: shogo82148/actions-setup-redis@c04803072c41cb7407800faf677b1e3384959c3b # v1
        with:
          redis-version: '7'
          auto-start: 'true'

      - name: Start Redis (Windows via Memurai)
        if: ${{ matrix.os == 'windows-latest' && matrix.filter == 'plugins' }}
        shell: pwsh
        run: |
          choco install -y memurai-developer.install
          # start service 'Memurai'
          net start Memurai
          # wait for 6379 port ready
          # $retries=30; $ready=$false
          # while ($retries -gt 0 -and -not $ready) {
          #   try {
          #     $ready = Test-NetConnection -ComputerName 127.0.0.1 -Port 6379 -InformationLevel Quiet
          #   } catch { $ready = $false }
          #   if (-not $ready) { Start-Sleep -Seconds 2; $retries-- }
          # }
          # if (-not $ready) { Write-Error "Memurai (Redis) not ready on port 6379" }

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run ci:${{ matrix.filter }}

      - name: Code Coverage
        # skip on windows, it will hangup on codecov
        if: ${{ matrix.os != 'windows-latest' }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          use_oidc: true

  test-egg-bin:
    strategy:
      fail-fast: false
      matrix:
        # os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        os: ['ubuntu-latest', 'windows-latest']
        node: ['22']

    name: Test egg-bin (${{ matrix.os }}, ${{ matrix.node }})
    runs-on: ${{ matrix.os }}

    concurrency:
      group: test-egg-bin-${{ github.workflow }}-#${{ github.event.pull_request.number || github.head_ref || github.ref }}-(${{ matrix.os }}, ${{ matrix.node }})
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Install pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run --filter="@eggjs/bin" ci

      - name: Code Coverage
        # skip on windows, it will hangup on codecov https://github.com/codecov/codecov-action/issues/1787
        if: ${{ matrix.os != 'windows-latest' }}
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7 # v5
        with:
          use_oidc: true
